spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  application:
    name: sos
  config:
    # .env is the only source of values: application.yaml has no fallbacks, so every
    # placeholder below must be set there (or as a real environment variable, which wins).
    # .env.example lists every name with a working value.
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Default max (10) queues behind the STOMP inbound pool (32-64 threads, see
      # WebSocketConfig) once location pings and REST traffic land concurrently.
      # 20 gives headroom without hogging Postgres's max_connections (100).
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      # Fail fast instead of the 30s default — a stuck pool should surface as an
      # error quickly, not hang every caller behind it.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS}
      # Without these a SELECT ... FOR UPDATE on a ticket waits forever behind a stuck transaction,
      # and every caller of that ticket queues on a pool connection until the pool is dry.
      # lock_timeout ends a wait for a row lock (answered 503, see GlobalExceptionHandler);
      # statement_timeout ends a runaway statement. Flyway is kept off this pool (spring.flyway.url
      # below): a CREATE INDEX on a big table must not be killed by statement_timeout.
      connection-init-sql: SET lock_timeout = ${DB_LOCK_TIMEOUT_MS}; SET statement_timeout = ${DB_STATEMENT_TIMEOUT_MS}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # The k-ring lookup binds up to ~1,000 cell ids in lists of varying size; padding the list
        # to the next power of two leaves a handful of statement shapes instead of one per size.
        query:
          in_clause_parameter_padding: true
  # Own connection, not the app pool: the pool's init SQL sets statement_timeout (see hikari above).
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  servlet:
    multipart:
      # Same env var as sos.media.max-upload-mb so the two limits can't drift.
      max-file-size: ${SOS_MEDIA_MAX_UPLOAD_MB}MB
      max-request-size: ${SOS_MEDIA_MAX_UPLOAD_MB}MB
  data:
    web:
      pageable:
        # Spring's default cap is 2000 rows per page, far above what any screen shows.
        max-page-size: 100
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Blank (local Redis) means no AUTH; the cluster's Redis requires one.
      # Fail fast instead of Lettuce's 60s default — a slow/unresponsive (not fully down) Redis
      # should hit the Kafka fallback (see RedisLocationListenerConfig) quickly, not after a
      # minute-long stall per command.
      timeout: ${REDIS_TIMEOUT_MS}ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    # PLAINTEXT for a Kafka without login (local, the master cluster's single broker). SASL_PLAINTEXT
    # (or SASL_SSL) for one that requires it, such as the Strimzi cluster with its SCRAM users. Every
    # producer, consumer and admin client here is built from these spring.kafka settings.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL}
    properties:
      # Both are ignored unless the protocol is SASL_*. KAFKA_SASL_JAAS_CONFIG is the whole
      # sasl.jaas.config line, as in the `sasl.jaas.config` key of the app's KafkaUser Secret.
      sasl.mechanism: ${KAFKA_SASL_MECHANISM}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        # Fail fast when the broker is unreachable. The default max.block.ms (60 s) holds the
        # calling request thread that long, so a Kafka outage would pin every Tomcat thread.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.autofik.sos.*"
        spring.json.value.default.type: com.autofik.sos.dto.event.MechanicLocationEvent

onesignal:
  app-id: ${ONESIGNAL_APP_ID}
  api-key: ${ONESIGNAL_API_KEY}
  # Push sends run on their own pool, one blocking OneSignal call each.
  push-threads: ${ONESIGNAL_PUSH_THREADS}
  push-queue-capacity: ${ONESIGNAL_PUSH_QUEUE_CAPACITY}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
    base-url: ${GOOGLE_MAPS_BASE_URL}
    # Google Maps calls per second this service may make.
    query-rate-limit: ${GOOGLE_MAPS_QUERY_RATE_LIMIT}
    
aws:
  s3:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET_NAME}
    # How long presigned photo URLs (upload responses and mechanic broadcasts) stay valid.
    presign-ttl-minutes: ${S3_PRESIGN_TTL_MINUTES}

server:
  port: ${SERVER_PORT}
  tomcat:
    # Exposes tomcat.threads.busy / tomcat.threads.current to Micrometer.
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/** is permitAll in SecurityConfig, so anything exposed here is public to whoever
        # can reach the port. Default stays at health; set to health,prometheus on a private
        # network (load-test stack, internal scrape) only.
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing: OpenTelemetry spans to Jaeger over OTLP/HTTP. Export on/off, the endpoint,
  # the sampling ratio and service.name come from the JAEGER_* variables the gateway and SSO read
  # too (see .env.example); JaegerEnvironmentPostProcessor maps them, and setting those four
  # properties here would override the variables. Not traced: /, /healthy, /actuator/** (TracingConfig).
  tracing:
    propagation:
      # W3C traceparent/tracestate in and out, as the gateway and SSO send them. Boot would also
      # accept B3 headers by default; nothing in this system sends them.
      type: w3c
    baggage:
      # W3C baggage travels with the trace context. Nothing here adds any.
      enabled: true
  opentelemetry:
    resource-attributes:
      "[deployment.environment]": ${spring.profiles.active:default}
      "[service.version]": "@project.version@"
  observations:
    enable:
      # Spring Security adds 4-5 spans to every request (filter chain before and after, authorize,
      # secured request) that repeat what the server span already says. Set true
      # (MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY=true) to see them; their spring.security.*
      # timers are off with them.
      "[spring.security]": false
      # The expiry, completion and no-show sweeps run every 15-30 s, and each run would be a trace
      # of its own, nearly always empty. The Kafka events, Google calls and pushes a sweep does make
      # still start traces. MANAGEMENT_OBSERVATIONS_ENABLE_TASKS_SCHEDULED_EXECUTION=true turns
      # them back on, with their tasks.scheduled.execution timer.
      "[tasks.scheduled.execution]": false

# JDBC spans from datasource-micrometer: one per connection and per statement, under the request,
# listener or push that ran them. Never the bound values (phone numbers, GPS coordinates), and no
# span per ResultSet.
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

websocket:
  # Restrict to your domain in production, e.g. https://*.autofik.com
  # Set WEBSOCKET_ALLOWED_ORIGINS env var or override in application-prod.yaml
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}
  # STOMP thread pools. Inbound handles client frames, outbound writes to sockets; a frame waits
  # in the queue when every thread is busy.
  inbound:
    core-pool-size: ${WEBSOCKET_INBOUND_CORE_POOL_SIZE}
    max-pool-size: ${WEBSOCKET_INBOUND_MAX_POOL_SIZE}
    queue-capacity: ${WEBSOCKET_INBOUND_QUEUE_CAPACITY}
  outbound:
    core-pool-size: ${WEBSOCKET_OUTBOUND_CORE_POOL_SIZE}
    max-pool-size: ${WEBSOCKET_OUTBOUND_MAX_POOL_SIZE}
    queue-capacity: ${WEBSOCKET_OUTBOUND_QUEUE_CAPACITY}
  # Socket bids and syncs run here, off the shared inbound threads.
  bid-commands:
    threads: ${WEBSOCKET_BID_COMMANDS_THREADS}
    queue-capacity: ${WEBSOCKET_BID_COMMANDS_QUEUE_CAPACITY}

medusa:
  base-url: ${MEDUSA_BASE_URL}
  public-key: ${MEDUSA_PUBLIC_KEY}
  # SOS create waits on this call, so both stay short.
  connect-timeout-ms: ${MEDUSA_CONNECT_TIMEOUT_MS}
  read-timeout-ms: ${MEDUSA_READ_TIMEOUT_MS}

billing:
  enabled: ${BILLING_ENABLED}
  base-url: ${BILLING_SERVICE_URL}
  service-key: ${BILLING_SERVICE_KEY}
  verify-path: ${BILLING_VERIFY_PATH}
  connect-timeout-ms: ${BILLING_CONNECT_TIMEOUT_MS}
  read-timeout-ms: ${BILLING_READ_TIMEOUT_MS}
  allowed-tiers:
    customer: ${BILLING_ALLOWED_TIERS_CUSTOMER}
    mechanic: ${BILLING_ALLOWED_TIERS_MECHANIC}

kafka:
  topic:
    # 1 is correct only for this repo's single-broker dev Kafka (see project CLAUDE.md). A
    # multi-broker SIT/prod cluster needs at least 3 for real durability — set via env there.
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR}
    # Partitions per app-managed topic. Kafka can only increase this on an existing topic.
    partitions: ${KAFKA_TOPIC_PARTITIONS}
  consumer:
    # Consumer threads for sos.notification (each push is a blocking OneSignal call).
    notification-concurrency: ${KAFKA_NOTIFICATION_CONCURRENCY}

sos:
  arrival:
    # A mechanic may only mark ARRIVED when their last known position is within this many metres
    # of the SOS. Measured against current_location in Postgres — never against coordinates sent
    # with the request, which the mechanic controls and could simply set to the customer's.
    # Note current_location is written at most once per sos.location.pg-sync-seconds (10s default), so a fast-moving mechanic's stored
    # position can lag their real one; raise this if legitimate arrivals are being rejected.
    max-distance-meters: ${SOS_ARRIVAL_MAX_DISTANCE_M}
    # How long the customer has to confirm the mechanic's arrival before it is accepted.
    approval-window-seconds: ${SOS_ARRIVAL_APPROVAL_WINDOW_SECONDS}
  auto-expand:
    # Step size and ceiling for widening the broadcast radius on a zero-bid retry. Deliberately
    # separate from the customer's own broadcastRadiusKm preference cap (@Max(20) in
    # CreateSosRequest) — this is the system's own last-resort fallback, allowed to search wider
    # than the customer ever asked for.
    step-km: ${SOS_AUTO_EXPAND_STEP_KM}
    max-km: ${SOS_AUTO_EXPAND_MAX_KM}
  no-show:
    # An assigned mechanic who has not moved for this many minutes is asked "are you still coming?".
    # 0 turns the sweep off. Needs the mobile app to show the question (frame STILL_COMING_CHECK)
    # and answer it with PATCH /sos/{id}/still-coming or /sos/{id}/mechanic-release.
    stalled-minutes: ${SOS_NO_SHOW_STALLED_MINUTES}
    # How long they have to answer before the job is released and offered to someone else.
    prompt-response-seconds: ${SOS_NO_SHOW_PROMPT_RESPONSE_SECONDS}
    # How often the check runs.
    sweep-interval-ms: ${SOS_NO_SHOW_SWEEP_INTERVAL_MS}
  dispatch:
    # A mechanic whose last location ping is older than this is not offered jobs and cannot bid
    # (they have probably closed the app). A mechanic with no recorded ping yet is treated as
    # fresh, so a deploy does not drop everyone who is offline at that moment.
    location-max-age-minutes: ${SOS_DISPATCH_LOCATION_MAX_AGE_MINUTES}
    # A mechanic whose road ETA to the SOS is longer than this is not offered the job, and a bid
    # carrying a longer ETA is refused. Straight-line radius ignores rivers and one-way roads.
    # Only applied where a Google estimate exists (the nearest offer-max-mechanics, and the bid's
    # own); no estimate never blocks. 0 disables.
    max-road-eta-minutes: ${SOS_DISPATCH_MAX_ROAD_ETA_MINUTES}
  eta:
    # How often a mechanic's location ping is allowed to trigger a real Google Distance Matrix
    # call while ACCEPTED/ON_THE_WAY; every other ping in the window interpolates against the
    # cached snapshot for free. This is the single biggest driver of Maps API spend (~86% of it
    # at typical usage) — lower for tighter live-ETA accuracy, raise to cut cost. The displayed
    # ETA keeps updating smoothly between refreshes either way (see RouteEtaServiceImpl#interpolate).
    refresh-interval-seconds: ${SOS_ETA_REFRESH_INTERVAL_SECONDS}
    # Lifetime of the cached ETA snapshot. Must outlive refresh-interval-seconds so pings between
    # refreshes always have a snapshot to interpolate against.
    cache-ttl-minutes: ${SOS_ETA_CACHE_TTL_MINUTES}
    # Real road distance/time shown to each mechanic in the job offer, before they bid. One
    # Distance Matrix request per fan-out, billed per mechanic (element), and only for mechanics
    # not already given an estimate for that SOS (auto-expand rounds reuse the earlier one).
    # Newly reached mechanics beyond this cap (nearest first) get the offer without an estimate.
    # Google allows at most 25 origins per request. 0 disables the Google call.
    offer-max-mechanics: ${SOS_ETA_OFFER_MAX_MECHANICS}
    # A stored offer estimate older than this is re-fetched on the next fan-out (mechanic has moved).
    offer-estimate-max-age-seconds: ${SOS_ETA_OFFER_ESTIMATE_MAX_AGE_SECONDS}
  location:
    # Mechanic GPS is written to Postgres at most once per this many seconds (Redis/Kafka carry
    # every ping). Lower = fresher current_location for the ARRIVED proximity check, more DB writes.
    pg-sync-seconds: ${MECHANIC_LOCATION_PG_SYNC_SECONDS}
    # A persisted ping this far (metres) from the previous one counts as the mechanic having moved.
    moved-threshold-meters: ${SOS_LOCATION_MOVED_THRESHOLD_M}
  h3:
    # WARNING: every stored mechanic current_h3_index was computed at this resolution. Changing it
    # breaks nearby-mechanic search until all rows are recomputed. center-to-center-km must match
    # the resolution (2.114 km is correct only for resolution 7).
    resolution: ${SOS_H3_RESOLUTION}
    center-to-center-km: ${SOS_H3_CENTER_TO_CENTER_KM}
  geo:
    # Mean Earth radius for straight-line (haversine) distance fallbacks.
    earth-radius-m: ${SOS_EARTH_RADIUS_M}
  media:
    # Max source image width/height in pixels, checked before decode. Security guard against
    # decompression-bomb uploads; raising it increases worst-case memory per upload.
    max-source-dimension: ${SOS_MEDIA_MAX_SOURCE_DIMENSION}
    max-upload-mb: ${SOS_MEDIA_MAX_UPLOAD_MB}
    # Photos decoded at once; another upload waits 2 s for a slot, then answers 503.
    max-concurrent-decodes: ${SOS_MEDIA_MAX_CONCURRENT_DECODES}
    # Photos kept per ticket; the next upload answers 409.
    max-per-sos: ${SOS_MEDIA_MAX_PER_SOS}
    # Stored photos are resized to fit this box, then re-encoded at this JPEG quality (0.0-1.0).
    max-image-dimension: ${SOS_MEDIA_MAX_IMAGE_DIMENSION}
    jpeg-quality: ${SOS_MEDIA_JPEG_QUALITY}
  broadcast:
    # Max photos attached to each mechanic fan-out. Each one is a fresh S3 presign per broadcast,
    # so raising this adds presign work and payload size on every create/offer round.
    max-photos: ${SOS_BROADCAST_MAX_PHOTOS}
    # Starting radius (km) when the customer doesn't set broadcastRadiusKm.
    default-km: ${SOS_DEFAULT_BROADCAST_KM}
  gateway:
    # The secret only the internal gateway knows, sent on every request in this header. Blank
    # turns the check off (local runs, tests); set it in every deployed environment, because
    # user-context / mechanic-context are unsigned and SOS acts on them completely.
    header: ${SOS_GATEWAY_HEADER}
    secret: ${SOS_GATEWAY_SECRET}
  bidding:
    # Seconds mechanics have to bid per broadcast attempt, and max rebroadcasts per ticket.
    window-seconds: ${SOS_BIDDING_WINDOW_SECONDS}
    max-rebroadcast: ${SOS_MAX_REBROADCAST}
  completion:
    # How long the customer has to approve or reject a mechanic's completion request. After that it
    # is approved automatically, so an unanswered request cannot leave the job open (it blocks the
    # customer from a new SOS and keeps the mechanic tied to it). Default 2 minutes (120 s); 90 s also works.
    approval-window-seconds: ${SOS_COMPLETION_APPROVAL_WINDOW_SECONDS}
    # How often the service looks for requests past that window.
    sweep-interval-ms: ${SOS_COMPLETION_SWEEP_INTERVAL_MS}
    # F-11: shortest time between starting a job (IN_PROGRESS) and the mechanic proposing COMPLETED; 0 = off
    min-in-progress-seconds: ${SOS_COMPLETION_MIN_IN_PROGRESS_SECONDS}
  create:
    # Minimum gap between two SOS creations by the same user.
    cooldown-seconds: ${SOS_CREATE_COOLDOWN_SECONDS}
  customer-wait:
    # Minutes a mechanic waits at ARRIVED before they may end the job for a missing customer.
    minutes: ${SOS_CUSTOMER_WAIT_MINUTES}
  scheduler:
    # Threads for the timers (bidding expiry, sweeps).
    pool-size: ${SOS_SCHEDULER_POOL_SIZE}

logging:
  level:
    root: INFO
    com.autofik: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    org.springframework.boot.autoconfigure.security: ERROR
    org.springframework.boot.security.autoconfigure: ERROR
    # A failed span export is reported once by TracingConfig, and again when export recovers. This
    # exporter's own report is a SEVERE with a stack trace, five a minute and then one a minute for
    # as long as Jaeger is unreachable.
    io.opentelemetry.exporter.internal.http.HttpExporter: "OFF"
  pattern:
    # [traceId,spanId] joins a line to its trace in Jaeger; left out when the line has no trace.
    console: "%d{HH:mm:ss} %-5level [%thread] %notEmpty{[%X{traceId},%X{spanId}] }%logger{36} - %msg%n"
