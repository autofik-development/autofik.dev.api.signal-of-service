spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  application:
    name: sos
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: sos-location-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.autofik.sos.*"
        spring.json.value.default.type: com.autofik.sos.dto.event.MechanicLocationEvent

onesignal:
  app-id: ${ONESIGNAL_APP_ID}
  api-key: ${ONESIGNAL_API_KEY}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
    
aws:
  s3:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET_NAME}

server:
  port: ${SERVER_PORT}

websocket:
  # Restrict to your domain in production, e.g. https://*.autofik.com
  # Set WEBSOCKET_ALLOWED_ORIGINS env var or override in application-prod.yaml
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}

medusa:
  base-url: ${MEDUSA_BASE_URL}
  public-key: ${MEDUSA_PUBLIC_KEY}

sso:
  # Everything up to and including the version segment — the mount differs per environment:
  #   local     http://localhost:4000/api
  #   deployed  https://sso.<env>.autofik.com/api/v1
  # The paths below it (/user/profile, /mechanic/profile, /user/vehicles/{id}) are identical
  # everywhere, so the difference stays in configuration rather than in code.
  base-url: ${SSO_BASE_URL}
  # Opens verify-token and nothing else. The profile and vehicle reads are scoped to the calling
  # user and present that user's own bearer instead.
  publishable-api-key: ${SSO_PUBLISHABLE_API_KEY}

sos:
  arrival:
    # A mechanic may only mark ARRIVED when their last known position is within this many metres
    # of the SOS. Measured against current_location in Postgres — never against coordinates sent
    # with the request, which the mechanic controls and could simply set to the customer's.
    # Note current_location is written at most once per 10s, so a fast-moving mechanic's stored
    # position can lag their real one; raise this if legitimate arrivals are being rejected.
    max-distance-meters: ${SOS_ARRIVAL_MAX_DISTANCE_M:50}

logging:
  level:
    root: INFO
    com.autofik: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    org.springframework.boot.autoconfigure.security: ERROR
    org.springframework.boot.security.autoconfigure: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
