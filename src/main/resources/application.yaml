spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  application:
    name: sos
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Default max (10) queues behind the STOMP inbound pool (32-64 threads, see
      # WebSocketConfig) once location pings and REST traffic land concurrently.
      # 20 gives headroom without hogging Postgres's max_connections (100).
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      # Fail fast instead of the 30s default — a stuck pool should surface as an
      # error quickly, not hang every caller behind it.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Fail fast instead of Lettuce's 60s default — a slow/unresponsive (not fully down) Redis
      # should hit the Kafka fallback (see RedisLocationListenerConfig) quickly, not after a
      # minute-long stall per command.
      timeout: 5000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: sos-location-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.autofik.sos.*"
        spring.json.value.default.type: com.autofik.sos.dto.event.MechanicLocationEvent

onesignal:
  app-id: ${ONESIGNAL_APP_ID}
  api-key: ${ONESIGNAL_API_KEY}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
    
aws:
  s3:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET_NAME}

server:
  port: ${SERVER_PORT}

websocket:
  # Restrict to your domain in production, e.g. https://*.autofik.com
  # Set WEBSOCKET_ALLOWED_ORIGINS env var or override in application-prod.yaml
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}

medusa:
  base-url: ${MEDUSA_BASE_URL}
  public-key: ${MEDUSA_PUBLIC_KEY}

kafka:
  topic:
    # 1 is correct only for this repo's single-broker dev Kafka (see project CLAUDE.md). A
    # multi-broker SIT/prod cluster needs at least 3 for real durability — set via env there.
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}

sos:
  arrival:
    # A mechanic may only mark ARRIVED when their last known position is within this many metres
    # of the SOS. Measured against current_location in Postgres — never against coordinates sent
    # with the request, which the mechanic controls and could simply set to the customer's.
    # Note current_location is written at most once per 10s, so a fast-moving mechanic's stored
    # position can lag their real one; raise this if legitimate arrivals are being rejected.
    max-distance-meters: ${SOS_ARRIVAL_MAX_DISTANCE_M:50}
  auto-expand:
    # Step size and ceiling for widening the broadcast radius on a zero-bid retry. Deliberately
    # separate from the customer's own broadcastRadiusKm preference cap (@Max(20) in
    # CreateSosRequest) — this is the system's own last-resort fallback, allowed to search wider
    # than the customer ever asked for.
    step-km: ${SOS_AUTO_EXPAND_STEP_KM:5}
    max-km: ${SOS_AUTO_EXPAND_MAX_KM:35}
  eta:
    # How often a mechanic's location ping is allowed to trigger a real Google Distance Matrix
    # call while ACCEPTED/ON_THE_WAY; every other ping in the window interpolates against the
    # cached snapshot for free. This is the single biggest driver of Maps API spend (~86% of it
    # at typical usage) — lower for tighter live-ETA accuracy, raise to cut cost. The displayed
    # ETA keeps updating smoothly between refreshes either way (see RouteEtaServiceImpl#interpolate).
    refresh-interval-seconds: ${SOS_ETA_REFRESH_INTERVAL_SECONDS:30}

logging:
  level:
    root: INFO
    com.autofik: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    org.springframework.boot.autoconfigure.security: ERROR
    org.springframework.boot.security.autoconfigure: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
