spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  application:
    name: sos
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Default max (10) queues behind the STOMP inbound pool (32-64 threads, see
      # WebSocketConfig) once location pings and REST traffic land concurrently.
      # 20 gives headroom without hogging Postgres's max_connections (100).
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      # Fail fast instead of the 30s default — a stuck pool should surface as an
      # error quickly, not hang every caller behind it.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
  servlet:
    multipart:
      # Same env var as sos.media.max-upload-mb so the two limits can't drift.
      max-file-size: ${SOS_MEDIA_MAX_UPLOAD_MB:10}MB
      max-request-size: ${SOS_MEDIA_MAX_UPLOAD_MB:10}MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # Fail fast instead of Lettuce's 60s default — a slow/unresponsive (not fully down) Redis
      # should hit the Kafka fallback (see RedisLocationListenerConfig) quickly, not after a
      # minute-long stall per command.
      timeout: ${REDIS_TIMEOUT_MS:1000}ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        # Fail fast when the broker is unreachable. The default max.block.ms (60 s) holds the
        # calling request thread that long, so a Kafka outage would pin every Tomcat thread.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:2000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:sos-location-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.autofik.sos.*"
        spring.json.value.default.type: com.autofik.sos.dto.event.MechanicLocationEvent

onesignal:
  app-id: ${ONESIGNAL_APP_ID}
  api-key: ${ONESIGNAL_API_KEY}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
    base-url: ${GOOGLE_MAPS_BASE_URL:}
    
aws:
  s3:
    endpoint: ${S3_ENDPOINT:https://fsgw.evauto24.com/}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET_NAME:autofik-sos-api}
    # How long presigned photo URLs (upload responses and mechanic broadcasts) stay valid.
    presign-ttl-minutes: ${S3_PRESIGN_TTL_MINUTES:15}

server:
  port: ${SERVER_PORT}
  tomcat:
    # Exposes tomcat.threads.busy / tomcat.threads.current to Micrometer.
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/** is permitAll in SecurityConfig, so anything exposed here is public to whoever
        # can reach the port. Default stays at health; set to health,prometheus on a private
        # network (load-test stack, internal scrape) only.
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

websocket:
  # Restrict to your domain in production, e.g. https://*.autofik.com
  # Set WEBSOCKET_ALLOWED_ORIGINS env var or override in application-prod.yaml
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}

medusa:
  base-url: ${MEDUSA_BASE_URL}
  public-key: ${MEDUSA_PUBLIC_KEY}

kafka:
  topic:
    # 1 is correct only for this repo's single-broker dev Kafka (see project CLAUDE.md). A
    # multi-broker SIT/prod cluster needs at least 3 for real durability — set via env there.
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    # Partitions per app-managed topic. Kafka can only increase this on an existing topic.
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}

sos:
  arrival:
    # A mechanic may only mark ARRIVED when their last known position is within this many metres
    # of the SOS. Measured against current_location in Postgres — never against coordinates sent
    # with the request, which the mechanic controls and could simply set to the customer's.
    # Note current_location is written at most once per sos.location.pg-sync-seconds (10s default), so a fast-moving mechanic's stored
    # position can lag their real one; raise this if legitimate arrivals are being rejected.
    max-distance-meters: ${SOS_ARRIVAL_MAX_DISTANCE_M:50}
  auto-expand:
    # Step size and ceiling for widening the broadcast radius on a zero-bid retry. Deliberately
    # separate from the customer's own broadcastRadiusKm preference cap (@Max(20) in
    # CreateSosRequest) — this is the system's own last-resort fallback, allowed to search wider
    # than the customer ever asked for.
    step-km: ${SOS_AUTO_EXPAND_STEP_KM:5}
    max-km: ${SOS_AUTO_EXPAND_MAX_KM:35}
  no-show:
    # An assigned mechanic who has not moved for this many minutes is asked "are you still coming?".
    # 0 turns the sweep off. Needs the mobile app to show the question (frame STILL_COMING_CHECK)
    # and answer it with PATCH /sos/{id}/still-coming or /sos/{id}/mechanic-release.
    stalled-minutes: ${SOS_NO_SHOW_STALLED_MINUTES:5}
    # How long they have to answer before the job is released and offered to someone else.
    prompt-response-seconds: ${SOS_NO_SHOW_PROMPT_RESPONSE_SECONDS:60}
    # How often the check runs.
    sweep-interval-ms: ${SOS_NO_SHOW_SWEEP_INTERVAL_MS:30000}
  dispatch:
    # A mechanic whose last location ping is older than this is not offered jobs and cannot bid
    # (they have probably closed the app). A mechanic with no recorded ping yet is treated as
    # fresh, so a deploy does not drop everyone who is offline at that moment.
    location-max-age-minutes: ${SOS_DISPATCH_LOCATION_MAX_AGE_MINUTES:5}
    # A mechanic whose road ETA to the SOS is longer than this is not offered the job, and a bid
    # carrying a longer ETA is refused. Straight-line radius ignores rivers and one-way roads.
    # Only applied where a Google estimate exists (the nearest offer-max-mechanics, and the bid's
    # own); no estimate never blocks. 0 disables.
    max-road-eta-minutes: ${SOS_DISPATCH_MAX_ROAD_ETA_MINUTES:30}
  eta:
    # How often a mechanic's location ping is allowed to trigger a real Google Distance Matrix
    # call while ACCEPTED/ON_THE_WAY; every other ping in the window interpolates against the
    # cached snapshot for free. This is the single biggest driver of Maps API spend (~86% of it
    # at typical usage) — lower for tighter live-ETA accuracy, raise to cut cost. The displayed
    # ETA keeps updating smoothly between refreshes either way (see RouteEtaServiceImpl#interpolate).
    refresh-interval-seconds: ${SOS_ETA_REFRESH_INTERVAL_SECONDS:30}
    # Lifetime of the cached ETA snapshot. Must outlive refresh-interval-seconds so pings between
    # refreshes always have a snapshot to interpolate against.
    cache-ttl-minutes: ${SOS_ETA_CACHE_TTL_MINUTES:15}
    # Real road distance/time shown to each mechanic in the job offer, before they bid. One
    # Distance Matrix request per fan-out, billed per mechanic (element), and only for mechanics
    # not already given an estimate for that SOS (auto-expand/rebroadcast reuse the earlier one).
    # Newly reached mechanics beyond this cap (nearest first) get the offer without an estimate.
    # Google allows at most 25 origins per request. 0 disables the Google call.
    offer-max-mechanics: ${SOS_ETA_OFFER_MAX_MECHANICS:25}
    # A stored offer estimate older than this is re-fetched on the next fan-out (mechanic has moved).
    offer-estimate-max-age-seconds: ${SOS_ETA_OFFER_ESTIMATE_MAX_AGE_SECONDS:300}
  location:
    # Mechanic GPS is written to Postgres at most once per this many seconds (Redis/Kafka carry
    # every ping). Lower = fresher current_location for the ARRIVED proximity check, more DB writes.
    pg-sync-seconds: ${MECHANIC_LOCATION_PG_SYNC_SECONDS:10}
    # A persisted ping this far (metres) from the previous one counts as the mechanic having moved.
    moved-threshold-meters: ${SOS_LOCATION_MOVED_THRESHOLD_M:20}
  h3:
    # WARNING: every stored mechanic current_h3_index was computed at this resolution. Changing it
    # breaks nearby-mechanic search until all rows are recomputed. center-to-center-km must match
    # the resolution (2.114 km is correct only for resolution 7).
    resolution: ${SOS_H3_RESOLUTION:7}
    center-to-center-km: ${SOS_H3_CENTER_TO_CENTER_KM:2.114}
  geo:
    # Mean Earth radius for straight-line (haversine) distance fallbacks.
    earth-radius-m: ${SOS_EARTH_RADIUS_M:6371000}
  media:
    # Max source image width/height in pixels, checked before decode. Security guard against
    # decompression-bomb uploads; raising it increases worst-case memory per upload.
    max-source-dimension: ${SOS_MEDIA_MAX_SOURCE_DIMENSION:8000}
    max-upload-mb: ${SOS_MEDIA_MAX_UPLOAD_MB:10}
    # Stored photos are resized to fit this box, then re-encoded at this JPEG quality (0.0-1.0).
    max-image-dimension: ${SOS_MEDIA_MAX_IMAGE_DIMENSION:1280}
    jpeg-quality: ${SOS_MEDIA_JPEG_QUALITY:0.80}
  broadcast:
    # Max photos attached to each mechanic fan-out. Each one is a fresh S3 presign per broadcast,
    # so raising this adds presign work and payload size on every create/rebroadcast.
    max-photos: ${SOS_BROADCAST_MAX_PHOTOS:3}
    # Starting radius (km) when the customer doesn't set broadcastRadiusKm.
    default-km: ${SOS_DEFAULT_BROADCAST_KM:15}
  gateway:
    # The secret only the internal gateway knows, sent on every request in this header. Blank
    # turns the check off (local runs, tests); set it in every deployed environment, because
    # user-context / mechanic-context are unsigned and SOS acts on them completely.
    header: ${SOS_GATEWAY_HEADER:X-Edge-Auth}
    secret: ${SOS_GATEWAY_SECRET:}
  bidding:
    # Seconds mechanics have to bid per broadcast attempt, and max rebroadcasts per ticket.
    window-seconds: ${SOS_BIDDING_WINDOW_SECONDS:60}
    max-rebroadcast: ${SOS_MAX_REBROADCAST:3}
  completion:
    # How long the customer has to approve or reject a mechanic's completion request. After that it
    # is approved automatically, so an unanswered request cannot leave the job open (it blocks the
    # customer from a new SOS and keeps the mechanic tied to it). Default 2 minutes (120 s); 90 s also works.
    approval-window-seconds: ${SOS_COMPLETION_APPROVAL_WINDOW_SECONDS:120}
    # How often the service looks for requests past that window.
    sweep-interval-ms: ${SOS_COMPLETION_SWEEP_INTERVAL_MS:15000}
  create:
    # Minimum gap between two SOS creations by the same user.
    cooldown-seconds: ${SOS_CREATE_COOLDOWN_SECONDS:60}

logging:
  level:
    root: INFO
    com.autofik: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    org.springframework.boot.autoconfigure.security: ERROR
    org.springframework.boot.security.autoconfigure: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
