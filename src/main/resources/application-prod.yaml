spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.autofik: INFO
  pattern:
    # [traceId,spanId] as in application.yaml, so a prod log line can be looked up in Jaeger.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %notEmpty{[%X{traceId},%X{spanId}] }%logger{36} - %msg%n"
