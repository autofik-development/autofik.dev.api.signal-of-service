spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    # Local DBs were built by ddl-auto=update before Flyway existed: mark them as already at V1
    # instead of re-running the baseline. Prod still defines no flyway block, so a non-empty prod
    # DB fails loudly until the deploy sets the env explicitly (relaxed binding reaches prod even
    # though this block sits in the dev profile). A pre-Flyway DB baselines ONCE with:
    #   SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
    # and SPRING_FLYWAY_BASELINE_VERSION = the highest version its schema already has. For a
    # Hibernate-era DB that already has uk_bid_sos_sos_mechanic that is 2 (V2 fails with
    # "constraint already exists" otherwise); V3/V4 are IF NOT EXISTS, so 2 is always safe.
    # Remove both variables after the first healthy boot.
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION}

logging:
  level:
    com.autofik: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

websocket:
  # Lets the handshake fall back to a caller-supplied ?clientId= and serves /test-ws.html, because
  # a browser cannot set headers on a WebSocket upgrade and the test console has no other way to
  # identify itself. This is the exact impersonation hole the user-context contract closes, so it
  # exists in this profile only — never in test, prod, or anything an app can reach.
  dev-insecure-handshake: true
