spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    com.autofik: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

websocket:
  # Lets the handshake fall back to a caller-supplied ?clientId= and serves /test-ws.html, because
  # a browser cannot set headers on a WebSocket upgrade and the test console has no other way to
  # identify itself. This is the exact impersonation hole the X-User-Id contract closes, so it
  # exists in this profile only — never in test, prod, or anything an app can reach.
  dev-insecure-handshake: true
