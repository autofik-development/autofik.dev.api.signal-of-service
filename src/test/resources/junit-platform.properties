# Fuzz (jqwik) settings. PR builds run a small, deterministic pass (seeds are pinned in the tests,
# see Fuzz.SEED). A nightly job goes deeper with -Djqwik.tries.default=20000 -Dfuzz.tries=2000
# -Dfuzz.seed=<fresh number> (the last two are for RestFuzzTest).
jqwik.tries.default=200
jqwik.seeds.whenfixed=ALLOW
# Failing seeds are remembered here and replayed first on the next run.
jqwik.database=target/.jqwik-database
jqwik.reporting.usejunitplatform=true
