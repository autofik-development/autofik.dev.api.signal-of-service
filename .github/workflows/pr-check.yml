name: PR Check

# The release workflow (master.yml) only runs on tags, and the Dockerfile builds with
# -DskipTests, so without this the test suite never runs in CI at all.
#
# Unit and integration tests run as parallel jobs; the last job ("Tests", the required check)
# gathers their results, sends them to Telegram and fails the PR if any of them failed.
on:
  pull_request:
    branches: [master]

# A new push to the same PR cancels the run still going for the previous one, so each push does not
# add a ~14 minute run and a second Telegram message for a commit that is already out of date.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    # A hung run would otherwise hold a runner for 6 hours and never report.
    timeout-minutes: 20
    outputs:
      lint: ${{ steps.lint.outcome }}
      unit: ${{ steps.unit.outcome }}
      counts: ${{ steps.results.outputs.counts }}
      coverage: ${{ steps.results.outputs.coverage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # continue-on-error on both: the Telegram message needs every result even when one fails.
      # The last job fails the PR.
      - name: Lint (spotless)
        id: lint
        continue-on-error: true
        run: ./mvnw -B spotless:check

      # SosApplicationTests boots the whole context and needs a live Postgres+PostGIS,
      # Redis and Kafka. Everything else is unit and slice tests that need nothing.
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: ./mvnw -B test -Dtest='!SosApplicationTests'
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Read results
        id: results
        if: always()
        run: |
          echo "counts=$(python3 .github/ci/surefire-summary.py target/surefire-reports)" >> "$GITHUB_OUTPUT"
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "coverage=$(python3 .github/ci/jacoco-summary.py target/site/jacoco/jacoco.csv)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test reports
        if: steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-unit
          path: target/surefire-reports/
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    # Normally about 10 minutes; a stuck container must not run for 6 hours.
    timeout-minutes: 30
    outputs:
      result: ${{ steps.it.outcome }}
      counts: ${{ steps.results.outputs.counts }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers: Postgres+PostGIS, Redis, Kafka (Docker is on the runner). About 10 minutes.
      # application.yaml reads spring.profiles.active from SPRING_PROFILES_ACTIVE with no default,
      # and the repository tests (@DataJpaTest) fail to load their context without it. Locally the
      # variable comes from .env, which CI does not have.
      - name: Integration tests
        id: it
        continue-on-error: true
        run: ./mvnw -B test -Pintegration -Dtest='!SosApplicationTests'
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Read results
        id: results
        if: always()
        run: echo "counts=$(python3 .github/ci/surefire-summary.py target/surefire-reports)" >> "$GITHUB_OUTPUT"

      - name: Upload test reports
        if: steps.it.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-integration
          path: target/surefire-reports/
          retention-days: 7

  # Required check. Keeps the old job name "Tests" so branch protection still matches.
  report:
    name: Tests
    # Waits for every job, the Docker build included, so the one message is sent when the run is
    # completely finished. The Docker build is not part of the message: its own check shows it.
    needs: [unit, integration, docker]
    # Not always(): a run cancelled by a newer push must not report (always() runs even then).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Only reads the results and posts one message.
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Telegram
        run: bash .github/ci/telegram-test-report.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          LINT_OUTCOME: ${{ needs.unit.outputs.lint || 'skipped' }}
          UNIT_OUTCOME: ${{ needs.unit.outputs.unit || 'skipped' }}
          IT_OUTCOME: ${{ needs.integration.outputs.result || 'skipped' }}
          UNIT_COUNTS: ${{ needs.unit.outputs.counts }}
          IT_COUNTS: ${{ needs.integration.outputs.counts }}
          COV: ${{ needs.unit.outputs.coverage }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail if anything failed
        if: needs.unit.outputs.lint != 'success' || needs.unit.outputs.unit != 'success' || needs.integration.outputs.result != 'success'
        run: exit 1

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    # Normally about 1 minute.
    timeout-minutes: 20

    # The release build happens on a tag, long after review. Without this, a change that
    # breaks the image is only discovered when someone tries to cut a release.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
