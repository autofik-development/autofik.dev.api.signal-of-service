name: Test Suite

# Heavier than the PR check (pr.yml): Docker integration tests, deeper fuzzing, and the load-test
# smoke run against a compose stack. Each job uploads its reports/ as an artifact, pass or fail.
#
# Scheduled/manual on purpose. Soak and stress runs are not in CI: they need a quiet dedicated host
# (see TESTING.md), so they are a manual workflow_dispatch input here, never on a PR.
on:
  workflow_dispatch:
    inputs:
      load_scenario:
        description: 'Extra load scenario to run after smoke (none, spike, cold-start, stress, soak)'
        default: 'none'
      soak_seconds:
        description: 'Soak length in seconds (only used when load_scenario is soak)'
        default: '7200'
  schedule:
    - cron: '0 20 * * 0'   # Sunday 20:00 UTC

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - run: scripts/run-tests.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-unit
          path: |
            reports/**/*.md
            reports/**/*.json
            reports/data/**/*.csv
            target/logs/*.log
          retention-days: 14

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - run: scripts/run-tests.sh integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-integration
          path: |
            reports/**/*.md
            reports/**/*.json
            reports/data/**/*.csv
            target/logs/*.log
          retention-days: 14

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - run: scripts/run-tests.sh fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-fuzz
          path: |
            reports/**/*.md
            reports/**/*.json
            target/logs/*.log
            target/.jqwik-database
          retention-days: 14

  load:
    name: Load (smoke, optional extra scenario)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the JMeter image and start the stack
        working-directory: load-tests
        run: |
          docker build -f Dockerfile.jmeter -t sos-jmeter .
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf http://localhost:18080/healthy && break; sleep 2; done
          docker compose exec -T postgres psql -U sos -d sos -v users=10000 -v mechanics=3000 < seed.sql
          sh warmup.sh
      - run: scripts/run-tests.sh load smoke
      - name: Extra scenario
        if: github.event.inputs.load_scenario != '' && github.event.inputs.load_scenario != 'none'
        run: |
          if [ "${{ github.event.inputs.load_scenario }}" = "soak" ]; then
            scripts/run-tests.sh load soak --duration "${{ github.event.inputs.soak_seconds }}"
          else
            scripts/run-tests.sh load "${{ github.event.inputs.load_scenario }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-load
          path: |
            reports/**/*.md
            reports/data/**/*.csv
            target/logs/*.log
            load-tests/results/jmeter.log
          retention-days: 14
      - if: always()
        working-directory: load-tests
        run: docker compose logs app | tail -300; docker compose down -v
